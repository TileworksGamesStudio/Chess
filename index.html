<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wizard's Chess — Sorcerer's Duel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&family=Metamorphous&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient Atmospheric FX Layers -->
  <div class="candle-glow candle-tl"></div>
  <div class="candle-glow candle-tr"></div>
  <div class="dungeon-dust"></div>

  <div id="game-app">
    <!-- Top Wizard HUD -->
    <header id="wizard-hud">
      <div class="crest-container">
        <span class="crest-icon">⚡</span>
        <div class="title-group">
          <h1>WIZARD'S CHESS</h1>
          <span class="subtitle">Arcane Stone Battlefield</span>
        </div>
      </div>

      <div class="turn-status-panel">
        <div class="house-badge" id="player-white-badge">
          <div class="orb white-orb"></div>
          <span>White Order</span>
        </div>
        <div class="status-phase" id="game-phase-text">White’s Turn to Cast</div>
        <div class="house-badge" id="player-black-badge">
          <div class="orb black-orb"></div>
          <span>Dark Council</span>
        </div>
      </div>
    </header>

    <!-- 4th-Wall Breaking Dialogue Banner -->
    <section id="dialogue-parchment" class="dialogue-bubble">
      <div class="speaker-avatar" id="dialogue-avatar">♟️</div>
      <div class="dialogue-content">
        <span class="speaker-title" id="dialogue-speaker">Pawn of Gryffon</span>
        <p id="dialogue-text">"Look out, Player! Don't just tap us around blindly. That dark bishop has murder in his stone eyes!"</p>
      </div>
    </section>

    <!-- Main Board Arena Viewport -->
    <main id="board-arena" class="perspective-3d">
      <!-- Graveyard Top (Dark Slain Pieces) -->
      <div class="graveyard graveyard-black" id="graveyard-black"></div>

      <!-- The Arcane Stone Chessboard Container -->
      <div id="board-wrapper">
        <div class="stone-pedestal"></div>
        <div id="chessboard" class="board-grid"></div>
        <canvas id="fx-canvas"></canvas>
      </div>

      <!-- Graveyard Bottom (White Slain Pieces) -->
      <div class="graveyard graveyard-white" id="graveyard-white"></div>
    </main>

    <!-- Mobile-First Tactical Controls -->
    <footer id="spell-controls">
      <button class="arcane-btn" id="btn-toggle-view" title="Toggle 3D Cinematic Perspective">
        <span class="btn-icon">👁️</span>
        <span class="btn-label">Perspective</span>
      </button>

      <button class="arcane-btn" id="btn-ai-mode" title="Toggle Solo vs Dark Wizard AI">
        <span class="btn-icon">🧙‍♂️</span>
        <span class="btn-label" id="ai-mode-label">AI: Dark Wizard</span>
      </button>

      <button class="arcane-btn" id="btn-spell-taunt" title="Demand Piece Wisdom">
        <span class="btn-icon">🔮</span>
        <span class="btn-label">Hex / Chat</span>
      </button>

      <button class="arcane-btn btn-danger" id="btn-restart" title="Reset the Magic Board">
        <span class="btn-icon">↺</span>
        <span class="btn-label">New Game</span>
      </button>

      <button class="arcane-btn" id="btn-sound-toggle" title="Toggle Magical Audio">
        <span class="btn-icon" id="sound-icon">🔊</span>
        <span class="btn-label">Audio</span>
      </button>
    </footer>
  </div>

  <!-- Checkmate / Defeat Modal -->
  <div id="game-modal" class="modal-overlay hidden">
    <div class="parchment-modal">
      <h2 id="modal-title">CHECKMATE!</h2>
      <div class="modal-crest" id="modal-crest">⚡</div>
      <p id="modal-desc">The stone armies stand pulverized. Victory belongs to the sorcerer!</p>
      <button class="arcane-btn btn-large" id="modal-restart">Begin Anew</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
