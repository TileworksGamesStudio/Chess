<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wizard's Chess 3D — Chamber of the Sorcerer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=MedievalSharp&family=Metamorphous&display=swap" rel="stylesheet">
  <!-- Three.js from trusted CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D Canvas Viewport -->
  <div id="webgl-container"></div>

  <!-- Screen Shake / Kill-Cam Arcane Flash -->
  <div id="fx-flash" class="flash-overlay"></div>

  <!-- Game HUD & 4th-Wall Overlay -->
  <div id="ui-layer">
    <!-- Top Wizard Status Bar -->
    <header id="top-bar">
      <div class="banner-title">
        <span class="rune-symbol">⚡</span>
        <div>
          <h1>WIZARD'S CHESS 3D</h1>
          <span class="subtext">Chamber of the Living Stone</span>
        </div>
      </div>

      <div class="turn-indicator" id="turn-indicator">
        <span class="orb white" id="turn-orb"></span>
        <span id="turn-text">White Order's Command</span>
      </div>
    </header>

    <!-- 4th-Wall Living Piece Dialogue Parchment -->
    <section id="dialogue-banner" class="dialogue-parchment">
      <div class="speaker-sigil" id="diag-sigil">♟️</div>
      <div class="dialogue-body">
        <div class="speaker-name" id="diag-name">Pawn of Gryffon</div>
        <div class="speaker-speech" id="diag-text">
          "Don't just stare through that phone screen! Tap me, point me at their knight, and watch me crush him to dust!"
        </div>
      </div>
    </section>

    <!-- Tactical Mobile HUD Controls -->
    <footer id="hud-controls">
      <button class="arcane-btn" id="btn-camera" title="Cycle Camera Angle">
        <span class="icon">🎥</span>
        <span class="label" id="cam-label">Cinematic</span>
      </button>

      <button class="arcane-btn" id="btn-ai" title="Toggle AI Opponent">
        <span class="icon">🧙‍♂️</span>
        <span class="label" id="ai-label">AI: Dark Lord</span>
      </button>

      <button class="arcane-btn" id="btn-taunt" title="Piece Wisdom & Taunts">
        <span class="icon">🔮</span>
        <span class="label">Consult</span>
      </button>

      <button class="arcane-btn btn-danger" id="btn-reset" title="Reform the Stone">
        <span class="icon">↺</span>
        <span class="label">Reset</span>
      </button>

      <button class="arcane-btn" id="btn-audio" title="Mute/Unmute Spells">
        <span class="icon" id="audio-icon">🔊</span>
        <span class="label">Magic</span>
      </button>
    </footer>
  </div>

  <!-- Game Over Screen -->
  <div id="game-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h2 id="modal-heading">CHECKMATE!</h2>
      <div class="modal-seal">⚡</div>
      <p id="modal-message">The dark army has been crushed into ancient rubble.</p>
      <button class="arcane-btn btn-large" id="modal-restart-btn">Reform Army</button>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
