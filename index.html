<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizard's Chess — The Grand Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js, OrbitControls, and GSAP via high-speed CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="webgl-container"></div>

  <!-- Vignette & Spell Flash Overlay -->
  <div id="vignette-overlay"></div>
  <div id="flash-overlay"></div>

  <!-- Top Banner / Game State HUD -->
  <header id="ui-header">
    <div class="heraldry-crest left-crest"></div>
    <div class="header-center">
      <h1 class="game-title">WIZARD’S CHESS</h1>
      <div class="turn-indicator-badge">
        <span class="pulse-gem" id="turn-gem"></span>
        <span id="turn-text">LUMOS ORDER’S MOVE</span>
      </div>
    </div>
    <div class="heraldry-crest right-crest"></div>
  </header>

  <!-- Left Sidebar: Captured Piece Crypts & Engine Eval -->
  <aside id="ui-left-panel" class="parchment-glass">
    <div class="panel-header">GRAVEYARD OF FALLEN PIECES</div>
    <div class="graveyard-section">
      <div class="graveyard-title">Lumos Casualties</div>
      <div id="white-graveyard" class="graveyard-slots"></div>
    </div>
    <div class="graveyard-divider"></div>
    <div class="graveyard-section">
      <div class="graveyard-title">Nox Casualties</div>
      <div id="black-graveyard" class="graveyard-slots"></div>
    </div>
  </aside>

  <!-- Right Sidebar: Duel Chronicle & Move Log -->
  <aside id="ui-right-panel" class="parchment-glass">
    <div class="panel-header">THE DUEL CHRONICLE</div>
    <div id="duel-log" class="chronicle-feed">
      <div class="log-entry system-message">The ancient chess chamber stirs. Cast your move, wizard.</div>
    </div>
  </aside>

  <!-- Bottom Control Bar -->
  <footer id="ui-footer">
    <div class="control-group">
      <label for="ai-difficulty">Opponent:</label>
      <select id="ai-difficulty" class="fantasy-select">
        <option value="1">Apprentice AI</option>
        <option value="2" selected>Auror Knight AI</option>
        <option value="3">Archmage AI</option>
        <option value="pvp">Pass & Play (2P)</option>
      </select>
    </div>

    <div class="button-row">
      <button id="btn-cam-tactical" class="fantasy-btn" title="Bird's Eye View">Tactical Cam</button>
      <button id="btn-cam-duel" class="fantasy-btn" title="Dynamic Duel Angle">Duel Cam</button>
      <button id="btn-cam-reset" class="fantasy-btn" title="Standard Free View">Free Cam</button>
      <button id="btn-undo" class="fantasy-btn" title="Turn back time">Undo Spell</button>
      <button id="btn-sound" class="fantasy-btn audio-btn" title="Toggle Magical Acoustics">Sound: ON</button>
      <button id="btn-restart" class="fantasy-btn danger-btn" title="Reset the board">Reset Duel</button>
    </div>
  </footer>

  <!-- Modal / End Game Overlay -->
  <div id="game-modal" class="modal-hidden">
    <div class="modal-card">
      <h2 id="modal-title">CHECKMATE!</h2>
      <p id="modal-desc">The Lumos Order has shattered the Obsidian Legion.</p>
      <button id="modal-btn-restart" class="fantasy-btn gold-glow">Re-engage the Duel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
